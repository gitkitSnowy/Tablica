<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Кировская область — Земля Вятская (Победа)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.2s ease, border-color 0.2s ease;
        }

        :root {
            --bg-gradient-start: #4a0000;
            --bg-gradient-end: #1a0000;
            --card-bg: rgba(255, 252, 245, 0.98);
            --text-primary: #2c0e0e;
            --text-secondary: #5d4037;
            --header-bg: linear-gradient(135deg, #b71c1c 0%, #880e4f 100%);
            --stat-bg: linear-gradient(120deg, #3e2723 0%, #1b0000 100%);
            --stat-card-bg: rgba(255, 215, 0, 0.08);
            --search-bg: #fbe9e7;
            --region-border: #d7ccc8;
            --region-hover-bg: #fff8e1;
            --percent-bg: linear-gradient(135deg, #b45f06, #8b3c00);
            --vote-btn-bg: linear-gradient(135deg, #e65100, #bf360c);
            --selected-info-bg: #fff3e0;
            --selected-info-color: #bf360c;
            --toast-bg: #3e2723;
            --particle-color: rgba(255, 215, 0, 0.4);
        }

        body.dark {
            --bg-gradient-start: #1b201a;
            --bg-gradient-end: #0a0c0a;
            --card-bg: rgba(22, 26, 22, 0.98);
            --text-primary: #dcedc8;
            --text-secondary: #9bad8d;
            --header-bg: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            --stat-bg: linear-gradient(120deg, #0d120d 0%, #000000 100%);
            --stat-card-bg: rgba(255, 140, 0, 0.05);
            --search-bg: #263238;
            --region-border: #37474f;
            --region-hover-bg: #1b201a;
            --percent-bg: linear-gradient(135deg, #b45f06, #8b3c00);
            --vote-btn-bg: linear-gradient(135deg, #b71c1c, #7f0000);
            --selected-info-bg: #1b0000;
            --selected-info-color: #ffccbc;
        }

        body {
            font-family: 'Segoe UI', -apple-system, 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at top, var(--bg-gradient-start), var(--bg-gradient-end));
            padding: 16px;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Георгиевская лента */
        .george-ribbon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: repeating-linear-gradient(45deg, #000, #000 15px, #ff8c00 15px, #ff8c00 30px);
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .particle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, var(--particle-color), transparent);
            pointer-events: none;
            z-index: 0;
            animation: firework 10s infinite ease-in-out;
        }

        @keyframes firework {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .app {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.7);
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 215, 0, 0.2);
            animation: appAppear 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: var(--text-primary);
            margin-top: 20px;
        }

        @keyframes appAppear {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .header {
            background: var(--header-bg);
            padding: 40px 24px 25px;
            text-align: center;
            color: white;
            position: relative;
            border-bottom: 3px solid #ffcc33;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 8px;
            font-weight: 500;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 6px 12px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .user-info {
            background: rgba(0,0,0,0.25);
            border-radius: 50px;
            padding: 6px 14px;
            margin-top: 15px;
            display: inline-flex;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Блок предсказаний */
        .prediction-section {
            padding: 15px 20px;
            background: var(--stat-card-bg);
            border-bottom: 1px solid rgba(255,215,0,0.2);
            text-align: center;
        }

        .predict-btn {
            background: linear-gradient(135deg, #ffcc33, #b45f06);
            color: #1a0000;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(180, 95, 6, 0.4);
            transition: transform 0.2s;
        }
        
        .predict-btn:active { transform: scale(0.95); }

        .predict-result {
            margin-top: 15px;
            font-size: 15px;
            font-weight: 600;
            font-style: italic;
            color: var(--selected-info-color);
            min-height: 40px;
            display: none;
            padding: 10px;
            border-left: 3px solid #ffcc33;
            background: var(--selected-info-bg);
            border-radius: 0 10px 10px 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .stats {
            padding: 20px;
            background: var(--stat-bg);
            border-bottom: 1px solid rgba(255,215,0,0.2);
        }

        .stats-grid {
            display: flex;
            gap: 10px;
        }

        .stat-card {
            flex: 1;
            background: var(--stat-card-bg);
            border-radius: 20px;
            padding: 15px 5px;
            text-align: center;
            border: 1px solid rgba(255,215,0,0.25);
        }

        .stat-number {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 5px;
            color: #d7ccc8;
        }

        .search-section { padding: 20px 20px 10px; }

        .search-box {
            display: flex;
            background: var(--search-bg);
            border-radius: 15px;
            padding: 0 15px;
            align-items: center;
            border: 1px solid var(--region-border);
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 15px 10px;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
        }

        .regions-container {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px 20px;
        }

        .region-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5px;
            border-bottom: 1px solid var(--region-border);
            cursor: pointer;
        }

        .region-item:hover {
            background: var(--region-hover-bg);
            border-radius: 10px;
        }

        .region-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .region-percent {
            background: var(--percent-bg);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            min-width: 55px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .vote-section {
            padding: 20px 20px 30px;
            text-align: center;
        }

        .vote-btn {
            background: var(--vote-btn-bg);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(191, 54, 12, 0.4);
        }

        .selected-info {
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            border-radius: 10px;
            background: var(--selected-info-bg);
            color: var(--selected-info-color);
            border: 1px dashed var(--selected-info-color);
        }

        .toast-notify {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--toast-bg);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            z-index: 1000;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast-notify.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="app">
    <div class="george-ribbon"></div>
    <div class="header">
        <button class="theme-toggle" id="themeToggle">🌙 Темная</button>
        <h1><span>⭐</span> Земля Вятская <span>⭐</span></h1>
        <p>Победа в единстве. Голосуй за свой город!</p>
        <div class="user-info" id="userInfoBlock">ID: Загрузка...</div>
    </div>

    <div class="prediction-section">
        <button class="predict-btn" id="predictBtn">✉️ Получить послание Победы</button>
        <div class="predict-result" id="predictResult"></div>
    </div>

    <div class="stats">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Вятчан</div></div>
            <div class="stat-card"><div class="stat-number" id="topRegionName">—</div><div class="stat-label">Лидер</div></div>
            <div class="stat-card"><div class="stat-number" id="topRegionPercent">0%</div><div class="stat-label">Доля</div></div>
        </div>
    </div>

    <div class="search-section">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Найти город области...">
        </div>
    </div>

    <div class="regions-container" id="regionsList"></div>

    <div class="vote-section">
        <button class="vote-btn" id="voteBtn">Голосовать за город</button>
        <div class="selected-info" id="selectedInfo">Выберите город из списка выше</div>
    </div>
</div>

    // --- ОСНОВНОЙ КОД ДВИЖКА (БЕЗ ИЗМЕНЕНИЙ) ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyu3gHjAR0YXFo0snsn2641gAbkpi_xbeqn2psOHLvek_JefdV6RRk0Agu2_KezpnWJWQ/exec";
    const REGIONS = ["Киров", "Кирово-Чепецк", "Слободской", "Вятские Поляны", "Котельнич", "Яранск", "Омутнинск", "Советск", "Уржум", "Нолинск", "Малмыж", "Белая Холуница", "Луза", "Кирс", "Мураши", "Зуевка", "Орлов", "Кикнур", "Тужа", "Санчурск", "Богородское", "Суна", "Верхошижемье", "Кумены", "Фалёнки", "Афанасьево", "Нагорск", "Подосиновец", "Даровской", "Шабалино", "Нема", "Опарино", "Юрья", "Кстинино", "Пижанка", "Лебяжье", "Свеча", "Стрижи", "Лянгасово", "Дороничи"];

    let votesData = {}, selectedRegion = null, currentSearchQuery = "", hasVoted = false, votedRegion = null;
    let currentUser = { id: localStorage.getItem("unique_user_id") || "user_" + Math.random().toString(36).substr(2, 9) + "_" + Date.now() };
    localStorage.setItem("unique_user_id", currentUser.id);

    function showToast(m, err=false) {
        let t = document.querySelector('.toast-notify') || document.createElement('div');
        t.className = 'toast-notify'; document.body.appendChild(t);
        t.innerText = m; t.style.background = err ? '#b71c1c' : '#2e7d32';
        t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function loadVotes() {
        return new Promise(res => {
            const cb = 'cb_' + Date.now();
            window[cb] = (data) => {
                delete window[cb]; REGIONS.forEach(r => votesData[r] = 0);
                if(!data.error) Object.entries(data).forEach(([r, v]) => { if(REGIONS.includes(r)) votesData[r] = v; });
                res();
            };
            const s = document.createElement('script'); s.src = SCRIPT_URL + '?callback=' + cb; document.body.appendChild(s);
        });
    }

    function render() {
        const cont = document.getElementById("regionsList");
        const filtered = REGIONS.filter(r => r.toLowerCase().includes(currentSearchQuery.toLowerCase()));
        const total = Object.values(votesData).reduce((a,b)=>a+b,0);
        
        cont.innerHTML = filtered.map(r => {
            const p = total === 0 ? 0 : Math.round((votesData[r]||0)/total*100);
            const isSelected = selectedRegion === r;
            return `<div class="region-item" onclick="sel('${r}')">
                <div class="region-name">📍 <span style="${isSelected?'color:#bf360c;font-weight:800':''}">${r}</span></div>
                <div class="region-percent">${p}%</div>
            </div>`;
        }).join('');

        document.getElementById("totalCount").innerText = total;
        document.getElementById("userInfoBlock").innerText = "🆔 ID: " + currentUser.id.slice(-8);
        
        const top = Object.entries(votesData).reduce((a, b) => b[1] > a[1] ? b : a, ["—", 0]);
        document.getElementById("topRegionName").innerText = top[0];
        document.getElementById("topRegionPercent").innerText = total > 0 ? Math.round(top[1]/total*100) + "%" : "0%";
    }

    window.sel = (r) => {
        if(hasVoted) return showToast("Вы уже поддержали " + votedRegion + "!", true);
        selectedRegion = r;
        document.getElementById("selectedInfo").innerHTML = `Ваш выбор: <b>${r}</b>`;
        render();
    }

    document.getElementById("voteBtn").onclick = async () => {
        if(!selectedRegion || hasVoted) return showToast("Выберите свой город!", true);
        const url = `${SCRIPT_URL}?callback=v&region=${encodeURIComponent(selectedRegion)}&userId=${currentUser.id}`;
        window.v = () => { 
            hasVoted = true; 
            votedRegion = selectedRegion; 
            localStorage.setItem("v", selectedRegion); 
            showToast("Голос принят! Спасибо."); 
            loadVotes().then(render); 
        };
        const s = document.createElement('script'); s.src = url; document.body.appendChild(s);
    };

    document.getElementById("searchInput").oninput = (e) => { currentSearchQuery = e.target.value; render(); };
    
    document.getElementById("themeToggle").onclick = () => {
        document.body.classList.toggle('dark');
        document.getElementById("themeToggle").innerText = document.body.classList.contains('dark') ? '☀️ Светлая' : '🌙 Темная';
    };

    if(localStorage.getItem("v")) { 
        hasVoted = true; votedRegion = localStorage.getItem("v"); 
        document.getElementById("selectedInfo").innerText = "Ваш вклад: " + votedRegion; 
    }

    loadVotes().then(render);

        "Вы откроете в себе новые удивительные способности.", "Ваша жизнь станет ярче и насыщеннее.", "Вы оставите добрый след в памяти людей.", "Ваша скромность украшает вас и притягивает удачу.", "Вы заложите прочный фундамент для будущего.",
        "Ваша стойкость вдохновляет окружающих.", "Вы получите заслуженную награду за свой труд.", "Ваша жизнь будет наполнена гармонией и миром.", "Вы с легкостью преодолеете все барьеры.", "Ваш дух непобедим, а воля тверда.",
        "Вы напишете свою собственную историю успеха.", "Ваша мудрость защитит вас от ошибок.", "Вы станете победителем в главной битве вашей жизни.", "Светлая память предков хранит вас на вашем пути.", "Пусть каждый ваш день будет днем мирных побед!"
    ];

    const predictBtn = document.getElementById('predictBtn');
    const predictResult = document.getElementById('predictResult');

    // Проверяем, есть ли уже предсказание на сегодня
    const today = new Date().toLocaleDateString();
    const savedPredictDate = localStorage.getItem('predict_date');
    const savedPredictText = localStorage.getItem('predict_text');

    if (savedPredictDate === today && savedPredictText) {
        predictBtn.style.display = 'none';
        predictResult.style.display = 'block';
        predictResult.innerText = savedPredictText;
    }

    predictBtn.onclick = () => {
        // Берем случайное предсказание (можно привязать жестко к ID, но рандом веселее)
        const randomIndex = Math.floor(Math.random() * PREDICTIONS.length);
        const text = "«" + PREDICTIONS[randomIndex] + "»";
        
        // Сохраняем в память
        localStorage.setItem('predict_date', today);
        localStorage.setItem('predict_text', text);
        
        // Анимация появления
        predictBtn.style.display = 'none';
        predictResult.style.display = 'block';
        predictResult.innerText = text;
    };

    // Создаем искры
    for(let i=0;i<12;i++){ 
        let p=document.createElement('div'); 
        p.className='particle'; 
        p.style.width=Math.random()*40+10+'px'; 
        p.style.height=p.style.width; 
        p.style.left=Math.random()*100+'%'; 
        p.style.animationDelay=Math.random()*8+'s'; 
        document.body.appendChild(p); 
    }
</script>
</body>
</html>
